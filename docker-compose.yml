# Role: Starts a local SQL Server 2022 for development (Sql mode only).
# The password comes from MSSQL_SA_PASSWORD in your .env file (never commit .env).
# Data is kept in the named volume "nbjewel-sqldata", so it survives restarts.
# Start: docker compose up -d    Stop: docker compose down    Wipe data: docker compose down -v
# On Apple Silicon Macs this image runs through emulation (Docker Desktop with Rosetta). It is slower to start.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: nbjewel-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your .env file}
    ports:
      - "1433:1433"
    volumes:
      - nbjewel-sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  nbjewel-sqldata:
